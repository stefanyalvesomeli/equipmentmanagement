<!DOCTYPE html>
<html lang="pt-BR">

  
<head>
  <!-- seu CSS continua aqui -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

 <script>

  /* =========================================================
     SUPABASE
     ========================================================= */

  const SUPABASE_URL =
    "https://ytnvsoodbzmjsaxkqqcg.supabase.co";

  const SUPABASE_KEY =
    "COLE_AQUI_SUA_PUBLISHABLE_KEY";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     CONFIGURAÇÕES
     ========================================================= */

  const tipos = [
    "hh",
    "notebook",
    "radio",
    "carregador",
    "doisD",
    "impressora"
  ];

  const nomesTipos = {
    hh: "HH",
    notebook: "Notebook",
    radio: "Rádio",
    carregador: "Carregador",
    doisD: "2D",
    impressora: "Impressora portátil"
  };

  const POR_PAGINA = 20;

  let dados = {
    hh: [],
    notebook: [],
    radio: [],
    carregador: [],
    doisD: [],
    impressora: []
  };

  let paginas = {
    hh: 1,
    notebook: 1,
    radio: 1,
    carregador: 1,
    doisD: 1,
    impressora: 1,
    quebrados: 1
  };


  /* =========================================================
     UTILIDADES
     ========================================================= */

  function gerarId() {

    return (
      Date.now().toString() +
      Math.random()
        .toString(16)
        .slice(2)
    );
  }


  function dataHoraAtual() {

    const agora = new Date();

    const ano =
      agora.getFullYear();

    const mes =
      String(
        agora.getMonth() + 1
      ).padStart(2, "0");

    const dia =
      String(
        agora.getDate()
      ).padStart(2, "0");

    const hora =
      String(
        agora.getHours()
      ).padStart(2, "0");

    const minuto =
      String(
        agora.getMinutes()
      ).padStart(2, "0");

    const segundo =
      String(
        agora.getSeconds()
      ).padStart(2, "0");

    return {
      data: `${ano}-${mes}-${dia}`,
      hora: `${hora}:${minuto}:${segundo}`
    };
  }


  function formatarData(data) {

    if (!data) return "-";

    const partes =
      String(data).split("-");

    if (partes.length !== 3) {
      return data;
    }

    return (
      `${partes[2]}/${partes[1]}/${partes[0]}`
    );
  }


  function escapeHTML(texto) {

    if (
      texto === null ||
      texto === undefined
    ) {
      return "";
    }

    return String(texto)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function mostrarAlerta(
    tipo,
    mensagem
  ) {

    const elemento =
      document.getElementById(
        "alert-" + tipo
      );

    if (!elemento) return;

    elemento.className =
      "alert show success";

    elemento.textContent =
      mensagem;

    setTimeout(() => {

      elemento.className =
        "alert";

    }, 3000);
  }


  function limparForm(tipo) {

    const form =
      document.getElementById(
        "form-" + tipo
      );

    if (form) {
      form.reset();
    }
  }


  /* =========================================================
     CONVERSÃO SUPABASE → SISTEMA
     ========================================================= */

  function converterRegistro(row) {

    return {

      id:
        String(row.id),

      codigo:
        row.codigo || "",

      nome:
        row.nome || "",

      funcao:
        row.funcao || "",

      status:
        row.status || "Funcionando",

      observacao:
        row.observacao || "",

      criadoEm: {
        data:
          row.criado_em
            ? String(row.criado_em).substring(0, 10)
            : "",
        hora:
          row.criado_em
            ? String(row.criado_em).substring(11, 19)
            : ""
      },

      quebradoEm:
        row.quebrado_data
          ? {
              data:
                row.quebrado_data,

              hora:
                row.quebrado_hora
                  ? String(
                      row.quebrado_hora
                    ).substring(0, 8)
                  : "",

              observacao:
                row.quebrado_observacao ||
                row.observacao ||
                ""
            }
          : null

    };
  }


  /* =========================================================
     CARREGAR TODOS OS EQUIPAMENTOS DO SUPABASE
     ========================================================= */

  async function carregarDados() {

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("equipamentos")
          .select("*")
          .order(
            "criado_em",
            {
              ascending: false
            }
          );

      if (error) {
        throw error;
      }

      dados = {
        hh: [],
        notebook: [],
        radio: [],
        carregador: [],
        doisD: [],
        impressora: []
      };

      (data || []).forEach(row => {

        const equipamento =
          converterRegistro(row);

        if (
          tipos.includes(row.tipo)
        ) {

          dados[row.tipo].push(
            equipamento
          );

        }

      });

      atualizarDashboard();

      tipos.forEach(tipo => {

        const pagina =
          document.getElementById(
            tipo
          );

        if (
          pagina &&
          pagina.classList.contains("active")
        ) {
          renderPage(tipo);
        }

      });

      const paginaQuebrados =
        document.getElementById(
          "quebrados"
        );

      if (
        paginaQuebrados &&
        paginaQuebrados.classList.contains(
          "active"
        )
      ) {

        preencherAnos();

        renderBroken();
      }

    } catch (error) {

      console.error(
        "Erro ao carregar dados do Supabase:",
        error
      );

      alert(
        "Não foi possível carregar os equipamentos do banco de dados."
      );
    }
  }


  /* =========================================================
     DASHBOARD
     ========================================================= */

  function atualizarDashboard() {

    const totalHH =
      dados.hh.length;

    const totalNotebook =
      dados.notebook.length;

    const totalRadio =
      dados.radio.length;

    const totalCarregador =
      dados.carregador.length;

    const totalDoisD =
      dados.doisD.length;

    const totalImpressora =
      dados.impressora.length;

    let totalQuebrados = 0;

    tipos.forEach(tipo => {

      totalQuebrados +=
        dados[tipo].filter(
          item =>
            item.status === "Quebrado"
        ).length;

    });

    atualizarNumero(
      "totalHH",
      totalHH
    );

    atualizarNumero(
      "totalNotebook",
      totalNotebook
    );

    atualizarNumero(
      "totalRadio",
      totalRadio
    );

    atualizarNumero(
      "totalCarregador",
      totalCarregador
    );

    atualizarNumero(
      "totalDoisD",
      totalDoisD
    );

    atualizarNumero(
      "total2D",
      totalDoisD
    );

    atualizarNumero(
      "totalImpressora",
      totalImpressora
    );

    atualizarNumero(
      "totalQuebrados",
      totalQuebrados
    );

    atualizarNumero(
      "totalEquipamentos",
      totalHH +
      totalNotebook +
      totalRadio +
      totalCarregador +
      totalDoisD +
      totalImpressora
    );
  }


  function atualizarNumero(
    id,
    valor
  ) {

    const elemento =
      document.getElementById(id);

    if (elemento) {
      elemento.textContent =
        valor;
    }
  }


  /* =========================================================
     NAVEGAÇÃO
     ========================================================= */

  function showPage(
    pageId,
    button
  ) {

    document
      .querySelectorAll(".page")
      .forEach(page => {

        page.classList.remove(
          "active"
        );

      });

    const pagina =
      document.getElementById(
        pageId
      );

    if (pagina) {

      pagina.classList.add(
        "active"
      );

    }

    document
      .querySelectorAll(".nav-btn")
      .forEach(btn => {

        btn.classList.remove(
          "active"
        );

      });

    if (button) {

      button.classList.add(
        "active"
      );

    }

    const sidebar =
      document.getElementById(
        "sidebar"
      );

    if (sidebar) {

      sidebar.classList.remove(
        "open"
      );

    }

    if (
      pageId ===
      "dashboard"
    ) {

      atualizarDashboard();

    }

    if (
      tipos.includes(pageId)
    ) {

      paginas[pageId] = 1;

      renderPage(
        pageId
      );

    }

    if (
      pageId ===
      "quebrados"
    ) {

      preencherAnos();

      paginas.quebrados = 1;

      renderBroken();

    }

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  function toggleMenu() {

    const sidebar =
      document.getElementById(
        "sidebar"
      );

    if (sidebar) {

      sidebar.classList.toggle(
        "open"
      );

    }
  }


  /* =========================================================
     CADASTRAR
     ========================================================= */

  async function adicionarEquipamento(
    tipo
  ) {

    const codigoInput =
      document.getElementById(
        tipo + "-codigo"
      );

    const nomeInput =
      document.getElementById(
        tipo + "-nome"
      );

    const statusInput =
      document.getElementById(
        tipo + "-status"
      );

    const observacaoInput =
      document.getElementById(
        tipo + "-observacao"
      );

    if (
      !codigoInput ||
      !nomeInput ||
      !statusInput ||
      !observacaoInput
    ) {

      alert(
        "Não foi possível localizar os campos do formulário."
      );

      return;
    }

    const codigo =
      codigoInput.value.trim();

    const nome =
      nomeInput.value.trim();

    const status =
      statusInput.value;

    const observacao =
      observacaoInput.value.trim();

    let funcao = "";

    if (
      tipo ===
      "notebook"
    ) {

      const funcaoInput =
        document.getElementById(
          "notebook-funcao"
        );

      if (funcaoInput) {

        funcao =
          funcaoInput.value.trim();

      }

    }

    if (!codigo) {

      alert(
        "Preencha o código do equipamento."
      );

      codigoInput.focus();

      return;
    }

    if (!nome) {

      alert(
        "Preencha o nome."
      );

      nomeInput.focus();

      return;
    }


    /* Verifica código duplicado no banco */

    try {

      const {
        data: existente,
        error: erroBusca
      } =
        await supabaseClient
          .from("equipamentos")
          .select("id")
          .eq(
            "codigo",
            codigo
          )
          .maybeSingle();

      if (erroBusca) {
        throw erroBusca;
      }

      if (existente) {

        alert(
          "Já existe um equipamento cadastrado com este código."
        );

        codigoInput.focus();

        return;
      }


      const quebra =
        status === "Quebrado"
          ? dataHoraAtual()
          : null;


      const registro = {

        tipo:
          tipo,

        codigo:
          codigo,

        nome:
          nome,

        funcao:
          tipo === "notebook"
            ? funcao || null
            : null,

        observacao:
          observacao || null,

        status:
          status,

        quebrado_data:
          quebra
            ? quebra.data
            : null,

        quebrado_hora:
          quebra
            ? quebra.hora
            : null,

        quebrado_observacao:
          quebra
            ? observacao || null
            : null

      };


      const {
        data,
        error
      } =
        await supabaseClient
          .from("equipamentos")
          .insert([
            registro
          ])
          .select()
          .single();


      if (error) {
        throw error;
      }


      /* Adiciona imediatamente à memória */

      const novo =
        converterRegistro(
          data
        );

      dados[tipo].unshift(
        novo
      );


      atualizarDashboard();

      limparForm(tipo);

      paginas[tipo] = 1;

      renderPage(tipo);


      mostrarAlerta(
        tipo,
        "Equipamento cadastrado com sucesso!"
      );


      if (
        status ===
        "Quebrado"
      ) {

        alert(
          "Equipamento registrado como QUEBRADO.\n\n" +
          "A data e a hora da quebra foram registradas automaticamente."
        );

      }

    } catch (error) {

      console.error(
        "Erro ao cadastrar equipamento:",
        error
      );

      alert(
        "Erro ao cadastrar equipamento no banco de dados.\n\n" +
        (error.message || "Verifique sua conexão.")
      );
    }
  }


  /* =========================================================
     FORMULÁRIOS
     ========================================================= */

  function registrarEventosFormularios() {

    tipos.forEach(tipo => {

      const form =
        document.getElementById(
          "form-" + tipo
        );

      if (!form) return;

      form.addEventListener(
        "submit",
        function(event) {

          event.preventDefault();

          adicionarEquipamento(
            tipo
          );

        }
      );

    });
  }


  /* =========================================================
     BUSCA DOS CADASTROS
     ========================================================= */

  function obterBusca(
    tipo
  ) {

    const input =
      document.getElementById(
        "busca-" + tipo
      );

    if (!input) {
      return "";
    }

    return input.value
      .trim()
      .toLowerCase();
  }


  function filtrarDados(
    tipo
  ) {

    const busca =
      obterBusca(tipo);

    if (!busca) {

      return [
        ...dados[tipo]
      ];

    }

    return dados[tipo]
      .filter(item => {

        return (

          String(
            item.codigo || ""
          )
            .toLowerCase()
            .includes(busca)

          ||

          String(
            item.nome || ""
          )
            .toLowerCase()
            .includes(busca)

          ||

          String(
            item.observacao || ""
          )
            .toLowerCase()
            .includes(busca)

        );

      });
  }


  /* =========================================================
     RENDERIZAÇÃO DOS CADASTROS
     ========================================================= */

  function renderPage(
    tipo
  ) {

    const container =
      document.getElementById(
        "tabela-" + tipo
      );

    if (!container) {
      return;
    }

    const lista =
      filtrarDados(tipo);

    const totalPaginas =
      Math.max(
        1,
        Math.ceil(
          lista.length /
          POR_PAGINA
        )
      );

    if (
      paginas[tipo] >
      totalPaginas
    ) {

      paginas[tipo] =
        totalPaginas;

    }

    const inicio =
      (
        paginas[tipo] - 1
      ) *
      POR_PAGINA;

    const pagina =
      lista.slice(
        inicio,
        inicio + POR_PAGINA
      );


    if (
      pagina.length === 0
    ) {

      container.innerHTML = `
        <div class="empty">
          Nenhum equipamento encontrado.
        </div>
      `;

      return;
    }


    let html = `

      <div class="table-container">

        <table>

          <thead>

            <tr>

              <th>Código</th>

              <th>Nome</th>

              ${
                tipo === "notebook"
                  ? "<th>Função</th>"
                  : ""
              }

              <th>Status</th>

              <th>Observação</th>

              <th>Ações</th>

            </tr>

          </thead>

          <tbody>
    `;


    pagina.forEach(item => {

      html += `

        <tr>

          <td>
            <strong>
              ${escapeHTML(
                item.codigo
              )}
            </strong>
          </td>

          <td>
            ${escapeHTML(
              item.nome
            )}
          </td>

          ${
            tipo === "notebook"
              ? `
                <td>
                  ${escapeHTML(
                    item.funcao ||
                    "-"
                  )}
                </td>
              `
              : ""
          }

          <td>

            <span class="status ${
              item.status ===
              "Quebrado"
                ? "status-broken"
                : "status-ok"
            }">

              ${escapeHTML(
                item.status
              )}

            </span>

          </td>

          <td>

            ${escapeHTML(
              item.observacao ||
              "-"
            )}

          </td>

          <td>

            <div class="table-actions">

              <button
                class="edit-btn"
                onclick="editarEquipamento(
                  '${tipo}',
                  '${escapeHTML(item.id)}'
                )">

                ✏️ Editar

              </button>

              <button
                class="delete-btn"
                onclick="excluirEquipamento(
                  '${tipo}',
                  '${escapeHTML(item.id)}'
                )">

                🗑️ Excluir

              </button>

            </div>

          </td>

        </tr>

      `;

    });


    html += `

          </tbody>

        </table>

      </div>

    `;


    html += criarPaginacao(
      tipo,
      totalPaginas,
      paginas[tipo],
      "normal"
    );


    container.innerHTML =
      html;
  }


  /* =========================================================
     PAGINAÇÃO
     ========================================================= */

  function criarPaginacao(
    tipo,
    total,
    atual,
    modo
  ) {

    if (
      total <= 1
    ) {

      return "";

    }


    let html =
      `<div class="pagination">`;


    html += `

      <button
        onclick="mudarPagina(
          '${tipo}',
          ${atual - 1},
          '${modo}'
        )"
        ${atual === 1 ? "disabled" : ""}>

        ← Anterior

      </button>

    `;


    for (
      let i = 1;
      i <= total;
      i++
    ) {

      html += `

        <button
          class="${
            i === atual
              ? "active"
              : ""
          }"
          onclick="mudarPagina(
            '${tipo}',
            ${i},
            '${modo}'
          )">

          ${i}

        </button>

      `;

    }


    html += `

      <button
        onclick="mudarPagina(
          '${tipo}',
          ${atual + 1},
          '${modo}'
        )"
        ${atual === total ? "disabled" : ""}>

        Próxima →

      </button>

    `;


    html +=
      `</div>`;


    return html;
  }


  function mudarPagina(
    tipo,
    pagina,
    modo
  ) {

    if (
      modo ===
      "broken"
    ) {

      paginas.quebrados =
        pagina;

      renderBroken();

      return;
    }


    paginas[tipo] =
      pagina;

    renderPage(tipo);
  }


  /* =========================================================
     EXCLUIR EQUIPAMENTO
     ========================================================= */

  async function excluirEquipamento(
    tipo,
    id
  ) {

    const item =
      dados[tipo].find(
        equipamento =>
          String(
            equipamento.id
          ) === String(id)
      );

    if (!item) {
      return;
    }


    const confirmou =
      confirm(
        `Deseja realmente excluir o equipamento "${item.nome}" (${item.codigo})?`
      );


    if (!confirmou) {
      return;
    }


    try {

      const {
        error
      } =
        await supabaseClient
          .from("equipamentos")
          .delete()
          .eq(
            "id",
            id
          );


      if (error) {
        throw error;
      }


      dados[tipo] =
        dados[tipo].filter(
          equipamento =>
            String(
              equipamento.id
            ) !== String(id)
        );


      atualizarDashboard();

      renderPage(tipo);

      renderBroken();

      alert(
        "Equipamento excluído com sucesso."
      );


    } catch (error) {

      console.error(
        "Erro ao excluir:",
        error
      );

      alert(
        "Não foi possível excluir o equipamento."
      );

    }
  }


  /* =========================================================
     EDITAR EQUIPAMENTO
     ========================================================= */

  async function editarEquipamento(
    tipo,
    id
  ) {

    const item =
      dados[tipo].find(
        equipamento =>
          String(
            equipamento.id
          ) === String(id)
      );


    if (!item) {
      return;
    }


    let html = `

      <form id="form-edicao">

        <div class="form-grid">

          <div class="form-group">

            <label>
              Código
            </label>

            <input
              id="edit-codigo"
              value="${escapeHTML(
                item.codigo
              )}"
              required>

          </div>


          <div class="form-group">

            <label>
              Nome
            </label>

            <input
              id="edit-nome"
              value="${escapeHTML(
                item.nome
              )}"
              required>

          </div>

    `;


    if (
      tipo ===
      "notebook"
    ) {

      html += `

        <div class="form-group">

          <label>
            Função
          </label>

          <input
            id="edit-funcao"
            value="${escapeHTML(
              item.funcao || ""
            )}">

        </div>

      `;
    }


    html += `

          <div class="form-group">

            <label>
              Status
            </label>

            <select
              id="edit-status">

              <option
                value="Funcionando"
                ${
                  item.status ===
                  "Funcionando"
                    ? "selected"
                    : ""
                }>

                Funcionando

              </option>

              <option
                value="Quebrado"
                ${
                  item.status ===
                  "Quebrado"
                    ? "selected"
                    : ""
                }>

                Quebrado

              </option>

            </select>

          </div>


          <div class="form-group full">

            <label>
              Observação
            </label>

            <textarea
              id="edit-observacao"
            >${escapeHTML(
              item.observacao ||
              ""
            )}</textarea>

          </div>

        </div>


        <div class="actions">

          <button
            type="submit"
            class="btn btn-primary">

            Salvar alterações

          </button>


          <button
            type="button"
            class="btn btn-secondary"
            onclick="fecharModal()">

            Cancelar

          </button>

        </div>

      </form>

    `;


    const modalContent =
      document.getElementById(
        "modalContent"
      );

    const modal =
      document.getElementById(
        "modalEditar"
      );


    if (
      !modalContent ||
      !modal
    ) {

      alert(
        "Modal de edição não encontrado no HTML."
      );

      return;
    }


    modalContent.innerHTML =
      html;

    modal.classList.add(
      "show"
    );


    const form =
      document.getElementById(
        "form-edicao"
      );


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const novoCodigo =
          document.getElementById(
            "edit-codigo"
          )
            .value
            .trim();


        const novoNome =
          document.getElementById(
            "edit-nome"
          )
            .value
            .trim();


        const novoStatus =
          document.getElementById(
            "edit-status"
          ).value;


        const novaObservacao =

        const statusAnterior =

            : null;


        let quebraObservacao =

        ) {

        }


        if (

  function obterQuebrados() {

    const resultado = [];

    tipos.forEach(tipo => {

        if (
          item.status ===
          "Quebrado"
        ) {

          resultado.push({
            ...item,
            tipo
          });

        }

      });

    });


    resultado.sort(
      (a, b) => {

        const dataA =
          a.quebradoEm
            ? `${a.quebradoEm.data} ${a.quebradoEm.hora}`
            : "";

        const dataB =
          b.quebradoEm
            ? `${b.quebradoEm.data} ${b.quebradoEm.hora}`
            : "";


        return dataB.localeCompare(
          dataA
        );

      }
    );


    return resultado;
  }

    const mes =

    let lista =

        if (

        }


        if (

        if (

            Number(
              item.quebradoEm.data

        ) {

/*
 * Mantém compatibilidade com os botões
 * existentes no HTML.
 *
 * Exemplos:
 *
 * onclick="showPage('dashboard', this)"
 * onclick="showPage('hh', this)"
 * onclick="showPage('notebook', this)"
 * onclick="showPage('radio', this)"
 * onclick="showPage('carregador', this)"
 * onclick="showPage('doisD', this)"
 * onclick="showPage('impressora', this)"
 * onclick="showPage('quebrados', this)"
 */

function showPage(pageId, button) {

  /*
   * Esconde todas as páginas.
   */
  document
    .querySelectorAll(".page")
    .forEach(page => {

      page.classList.remove("active");

    });


  /*
   * Mostra a página selecionada.
   */
  const pagina =
    document.getElementById(pageId);

  if (pagina) {

    pagina.classList.add("active");

  }


  /*
   * Remove o estado ativo
   * dos botões da lateral.
   */
  document
    .querySelectorAll(".nav-btn")
    .forEach(btn => {

      btn.classList.remove("active");

    });


  /*
   * Ativa o botão selecionado.
   */
  if (button) {

    button.classList.add("active");

  }


  /*
   * Fecha o menu lateral
   * no celular.
   */
  const sidebar =
    document.getElementById("sidebar");

  if (sidebar) {

    sidebar.classList.remove("open");

  }


  /*
   * Dashboard
   */
  if (pageId === "dashboard") {

    atualizarDashboard();

  }


  /*
   * Abas de equipamentos
   */
  if (tipos.includes(pageId)) {

    paginas[pageId] = 1;

    renderPage(pageId);

  }


  /*
   * Aba de equipamentos quebrados
   */
  if (pageId === "quebrados") {

    paginas.quebrados = 1;

    preencherAnos();

    renderBroken();

  }


  /*
   * Volta para o topo da página.
   */
  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}

/* =========================================================
   BUSCA DOS EQUIPAMENTOS
   ========================================================= */

function obterBusca(tipo) {

  const input =
    document.getElementById(
      "busca-" + tipo
    );

  if (!input) {

    return "";

  }

  return input.value
    .trim()
    .toLowerCase();

}


function filtrarDados(tipo) {

  const lista =
    Array.isArray(dados[tipo])
      ? dados[tipo]
      : [];

  const busca =
    obterBusca(tipo);


  /*
   * Sem busca:
   * retorna todos.
   */
  if (!busca) {

    return [...lista];

  }


  /*
   * Busca por código ou nome.
   */
  return lista.filter(item => {

    const codigo =
      String(
        item.codigo || ""
      ).toLowerCase();

    const nome =
      String(
        item.nome || ""
      ).toLowerCase();

    return (
      codigo.includes(busca) ||
      nome.includes(busca)
    );

  });

}

/* =========================================================
   PAGINAÇÃO
   ========================================================= */

function criarPaginacao(
  tipo,
  total,
  atual,
  modo
) {

  if (
    total <= 1
  ) {

    return "";

  }


  let html =
    `<div class="pagination">`;


  html += `

    <button

      onclick="
        mudarPagina(
          '${tipo}',
          ${atual - 1},
          '${modo}'
        )
      "

      ${atual === 1
        ? "disabled"
        : ""}

    >

      ← Anterior

    </button>

  `;


  for (
    let i = 1;
    i <= total;
    i++
  ) {

    html += `

      <button

        class="${
          i === atual
            ? "active"
            : ""
        }"

        onclick="
          mudarPagina(
            '${tipo}',
            ${i},
            '${modo}'
          )
        "

      >

        ${i}

      </button>

    `;

  }


  html += `

    <button

      onclick="
        mudarPagina(
          '${tipo}',
          ${atual + 1},
          '${modo}'
        )
      "

      ${atual === total
        ? "disabled"
        : ""}

    >

      Próxima →

    </button>

  `;


  html += `</div>`;


  return html;

}


function mudarPagina(
  tipo,
  pagina,
  modo
) {

  if (
    modo === "broken"
  ) {

    paginas.quebrados =
      pagina;

    renderBroken();

    return;

  }


  paginas[tipo] =
    pagina;

  renderPage(tipo);

}

async function editarEquipamento(
  tipo,
  id
) {

  /*
   * Procura primeiro nos dados
   * que já foram carregados.
   */
  const item =
    dados[tipo]?.find(
      equipamento =>
        String(equipamento.id) ===
        String(id)
    );


  if (!item) {

    alert(
      "Equipamento não encontrado."
    );

    return;

  }


  let html = `

    <form id="form-edicao">

      <div class="form-grid">

        <div class="form-group">

          <label>
            Código
          </label>

          <input

            id="edit-codigo"

            value="${escapeHTML(
              item.codigo
            )}"

            required

          >

        </div>


        <div class="form-group">

          <label>
            Nome
          </label>

          <input

            id="edit-nome"

            value="${escapeHTML(
              item.nome
            )}"

            required

          >

        </div>

  `;


  /*
   * Função somente para Notebook.
   */
  if (
    tipo === "notebook"
  ) {

    html += `

      <div class="form-group">

        <label>
          Função
        </label>

        <input

          id="edit-funcao"

          value="${escapeHTML(
            item.funcao || ""
          )}"

        >

      </div>

    `;

  }


  html += `

        <div class="form-group">

          <label>
            Status
          </label>

          <select id="edit-status">

            <option

              value="Funcionando"

              ${
                item.status ===
                "Funcionando"
                  ? "selected"
                  : ""
              }

            >

              Funcionando

            </option>


            <option

              value="Quebrado"

              ${
                item.status ===
                "Quebrado"
                  ? "selected"
                  : ""
              }

            >

              Quebrado

            </option>

          </select>

        </div>


        <div class="form-group full">

          <label>
            Observação
          </label>

          <textarea
            id="edit-observacao"
          >${escapeHTML(
            item.observacao || ""
          )}</textarea>

        </div>


      </div>


      <div class="actions">

        <button

          type="submit"

          class="btn btn-primary"

        >

          Salvar alterações

        </button>


        <button

          type="button"

          class="btn btn-secondary"

          onclick="fecharModal()"

        >

          Cancelar

        </button>

      </div>

    </form>

  `;


  const modalContent =
    document.getElementById(
      "modalContent"
    );


  const modal =
    document.getElementById(
      "modalEditar"
    );


  if (!modalContent || !modal) {

    return;

  }


  modalContent.innerHTML =
    html;

  modal.classList.add(
    "show"
  );


  const formulario =
    document.getElementById(
      "form-edicao"
    );


  formulario.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const novoCodigo =
        document.getElementById(
          "edit-codigo"
        ).value.trim();


      const novoNome =
        document.getElementById(
          "edit-nome"
        ).value.trim();


      const novoStatus =
        document.getElementById(
          "edit-status"
        ).value;


      const novaObservacao =
        document.getElementById(
          "edit-observacao"
        ).value.trim();


      let novaFuncao = "";


      if (
        tipo === "notebook"
      ) {

        novaFuncao =
          document.getElementById(
            "edit-funcao"
          ).value.trim();

      }


      if (
        !novoCodigo ||
        !novoNome
      ) {

        alert(
          "Preencha o código e o nome."
        );

        return;

      }


      /*
       * Se estiver mudando o código,
       * verifica duplicidade.
       */
      if (
        novoCodigo !==
        item.codigo
      ) {

        const {
          data: duplicado,
          error: erroDuplicado
        } =
          await supabaseClient

            .from(
              "equipamentos"
            )

            .select("id")

            .eq(
              "codigo",
              novoCodigo
            )

            .neq(
              "id",
              id
            )

            .maybeSingle();


        if (erroDuplicado) {

          console.error(
            erroDuplicado
          );

          alert(
            "Não foi possível verificar o código."
          );

          return;

        }


        if (duplicado) {

          alert(
            "Já existe outro equipamento com este código."
          );

          return;

        }

      }


      /*
       * Mantém a data/hora antiga
       * se já estiver quebrado.
       */
      let quebradoData =
        item.quebradoEm?.data ||
        null;

      let quebradoHora =
        item.quebradoEm?.hora ||
        null;

      let quebradoObservacao =
        item.quebradoEm?.observacao ||
        null;


      /*
       * Funcionando → Quebrado
       */
      if (
        item.status !==
          "Quebrado" &&
        novoStatus ===
          "Quebrado"
      ) {

        const agora =
          dataHoraAtual();

        quebradoData =
          agora.data;

        quebradoHora =
          agora.hora;

        quebradoObservacao =
          novaObservacao;

      }


      /*
       * Quebrado → Funcionando
       */
      if (
        novoStatus ===
        "Funcionando"
      ) {

        quebradoData =
          null;

        quebradoHora =
          null;

        quebradoObservacao =
          null;

      }


      const atualizacao = {

        codigo:
          novoCodigo,

        nome:
          novoNome,

        funcao:
          tipo === "notebook"
            ? novaFuncao
            : null,

        status:

/* =========================================================
   EQUIPAMENTOS QUEBRADOS
   ========================================================= */

function obterQuebrados() {

  let resultado = [];


  tipos.forEach(tipo => {

    const lista =
      Array.isArray(
        dados[tipo]
      )
        ? dados[tipo]
        : [];


    lista.forEach(item => {

      if (
        item.status ===
        "Quebrado"
      ) {

        resultado.push({

          ...item,

          tipo

        });

      }

    });

  });


  /*
   * Mais recente primeiro.
   */
  resultado.sort(
    (a, b) => {

      const dataA =
        a.quebradoEm

          ? `${a.quebradoEm.data} ${a.quebradoEm.hora}`

          : "";

      const dataB =
        b.quebradoEm

          ? `${b.quebradoEm.data} ${b.quebradoEm.hora}`

          : "";


      return dataB.localeCompare(
        dataA
      );

    }
  );


  return resultado;

}


/* =========================================================
   FILTRO DE QUEBRADOS
   ========================================================= */

function filtrarQuebrados() {

  const inputBusca =
    document.getElementById(
      "busca-quebrados"
    );


  const inputData =
    document.getElementById(
      "filtro-data"
    );


  const inputMes =
    document.getElementById(
      "filtro-mes"
    );


  const inputAno =
    document.getElementById(
      "filtro-ano"
    );


  const busca =
    inputBusca
      ? inputBusca.value
          .trim()
          .toLowerCase()
      : "";


  const data =
    inputData
      ? inputData.value
      : "";


  const mes =
    inputMes
      ? inputMes.value
      : "";


  const ano =
    inputAno
      ? inputAno.value
      : "";


  let lista =
    obterQuebrados();


  lista =
    lista.filter(item => {

      const codigo =
        String(
          item.codigo || ""
        ).toLowerCase();


      const nome =
        String(
          item.nome || ""
        ).toLowerCase();


      if (
        busca &&
        !codigo.includes(
          busca
        ) &&
        !nome.includes(
          busca
        )
      ) {

        return false;

      }


      if (
        data &&
        (
          !item.quebradoEm ||
          item.quebradoEm.data !==
            data
        )
      ) {

        return false;

      }


      if (
        mes &&
        (
          !item.quebradoEm ||
          item.quebradoEm.data
            .split("-")[1] !==
            String(mes).padStart(
              2,
              "0"
            )
        )
      ) {

        return false;

      }


      if (
        ano &&
        (
          !item.quebradoEm ||
          item.quebradoEm.data
            .split("-")[0] !==
            String(ano)
        )
      ) {

        return false;

      }


      return true;

    });


  return lista;

}


/* =========================================================
   PREENCHER ANOS DOS FILTROS
   ========================================================= */

function preencherAnos() {

  const select =
    document.getElementById(
      "filtro-ano"
    );

  if (!select) return;


  const valorAtual =
    select.value;


  const anos =
    new Set();


  obterQuebrados()
    .forEach(item => {

      if (
        item.quebradoEm &&
        item.quebradoEm.data
      ) {

        anos.add(
          item.quebradoEm.data
            .split("-")[0]
        );

      }

    });


  const listaAnos =
    Array.from(anos)
      .sort(
        (a, b) =>
          Number(b) -
          Number(a)
      );


  select.innerHTML = `

    <option value="">
      Todos os anos
    </option>

  `;


  listaAnos.forEach(ano => {

    select.innerHTML += `

      <option
        value="${escapeHTML(
          ano
        )}">

        ${escapeHTML(
          ano
        )}

      </option>

    `;

  });


  select.value =
    valorAtual;

}


/* =========================================================
   RENDERIZAR EQUIPAMENTOS QUEBRADOS
   ========================================================= */

function renderBroken() {

  const container =
    document.getElementById(
      "tabela-quebrados"
    );

  if (!container) {

    return;

  }


  const lista =
    filtrarQuebrados();


  const totalPaginas =
    Math.max(

      1,

      Math.ceil(
        lista.length /
        POR_PAGINA
      )

    );


  if (
    paginas.quebrados >
    totalPaginas
  ) {

    paginas.quebrados =
      totalPaginas;

  }


  const inicio =
    (
      paginas.quebrados - 1
    ) * POR_PAGINA;


  const pagina =
    lista.slice(

      inicio,

      inicio + POR_PAGINA

    );


  if (
    pagina.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        Nenhum equipamento quebrado encontrado
        com os filtros selecionados.

      </div>

    `;

    return;

  }


  let html = `

    <div class="table-container">

      <table>

        <thead>

          <tr>

            <th>Equipamento</th>

            <th>Código</th>

            <th>Nome</th>

            <th>Data da quebra</th>

            <th>Hora</th>

            <th>Observação</th>

            <th>Ações</th>

          </tr>

        </thead>

        <tbody>

  `;


  pagina.forEach(item => {

    html += `

      <tr>

        <td>

          <strong>

            ${escapeHTML(
              nomesTipos[item.tipo] ||
              item.tipo
            )}

          </strong>

        </td>


        <td>

          ${escapeHTML(
            item.codigo
          )}

        </td>


        <td>

          ${escapeHTML(
            item.nome
          )}

        </td>


        <td>

          ${
            item.quebradoEm

              ? formatarDataExibicao(
                  item.quebradoEm.data
                )

              : "-"
          }

        </td>


        <td>

          ${
            item.quebradoEm

              ? escapeHTML(
                  item.quebradoEm.hora
                )

              : "-"
          }

        </td>


        <td>

          ${escapeHTML(
            item.observacao || "-"
          )}

        </td>


        <td>

          <div class="table-actions">

            <button

              class="edit-btn"

              onclick="
                editarQuebrado(
                  '${item.id}'
                )
              "

            >

              ✏️ Editar

            </button>


            <button

              class="delete-btn"

              onclick="
                excluirQuebrado(
                  '${item.id}'
                )
              "

            >

              🗑️ Excluir

            </button>

          </div>

        </td>

      </tr>

    `;

  });


  html += `

        </tbody>

      </table>

    </div>

  `;


  html += criarPaginacao(

    "quebrados",

    totalPaginas,

    paginas.quebrados,

    "broken"

  );


  container.innerHTML =
    html;

}


/* =========================================================
   FORMATAR DATA PARA EXIBIÇÃO
   ========================================================= */

function formatarDataExibicao(
  data
) {

  if (!data) {

    return "-";

  }


  const partes =
    String(data)
      .split("-");


  if (
    partes.length !== 3
  ) {

    return escapeHTML(
      data
    );

  }


  return `${partes[2]}/${partes[1]}/${partes[0]}`;

}

async function editarQuebrado(
  id
) {

  tipos.forEach(tipo => {

    const item =
      dados[tipo]?.find(
        equipamento =>
          String(
            equipamento.id
          ) ===
          String(id)
      );

        tipo;

    }

  });


  if (!encontrado) {

    alert(
      "Equipamento não encontrado."
    );

    return;

  }


  /*
   * Para manter compatibilidade
   * com o modal que você já criou.
   */
  const modal =
    document.getElementById(
      "modalQuebrado"
    );


  if (
    modal
  ) {

    const codigo =
      document.getElementById(
        "quebradoCodigo"
      );

    const nome =
      document.getElementById(
        "quebradoNome"
      );

    const tipo =
      document.getElementById(
        "quebradoTipo"
      );

    const observacao =
      document.getElementById(
        "quebradoObservacao"
      );

    const data =
      document.getElementById(
        "quebradoData"
      );

    const hora =
      document.getElementById(
        "quebradoHora"
      );


    if (codigo) {

      codigo.value =
        encontrado.codigo || "";

    }


    if (nome) {

      nome.value =
        encontrado.nome || "";

    }


    if (tipo) {

      tipo.value =
        nomesTipos[
          tipoEncontrado
        ] ||
        tipoEncontrado ||
        "";

    }


    if (observacao) {

      observacao.value =
        encontrado
          .quebradoEm
          ?.observacao ||
        encontrado
          .observacao ||
        "";

    }


    if (data) {

      data.value =
        encontrado
          .quebradoEm
          ?.data ||
        "";

    }


    if (hora) {

      hora.value =
        encontrado
          .quebradoEm
          ?.hora ||
        "";

    }


    /*
     * Guarda o equipamento
     * em edição.
     */
    window.equipamentoQuebradoEmEdicao = {

      id:
        encontrado.id,

      tipo:
        tipoEncontrado

    };


    modal.classList.add(
      "show"
    );


    return;

  }


  /*
   * Caso o modal específico
   * não exista, usa o modal
   * padrão de edição.
   */
  editarEquipamento(
    tipoEncontrado,
    encontrado.id
  );

}

async function editarEquipamento(
  tipo,
  id
) {

    dados[tipo].find(
      equipamento =>
        String(equipamento.id) ===
        String(id)
    );

  if (!item) {

    alert(
      "Equipamento não encontrado."
    );

    return;
  }

  let html = `

    <form id="form-edicao">

      <div class="form-grid">

        <div class="form-group">

          <label>
            Código
          </label>

          <input
            id="edit-codigo"
            value="${escapeHTML(item.codigo)}"
            required>

        </div>

        <div class="form-group">

          <label>
            Nome
          </label>

          <input
            id="edit-nome"
            value="${escapeHTML(item.nome)}"
            required>

        </div>
  `;

  if (tipo === "notebook") {

    html += `

      <div class="form-group">

        <label>
          Função
        </label>

        <input
          id="edit-funcao"
          value="${escapeHTML(
            item.funcao || ""
          )}">

      </div>

    `;

  }

  html += `

        <div class="form-group">

          <label>
            Status
          </label>

          <select id="edit-status">

            <option
              value="Funcionando"
              ${
                item.status ===
                "Funcionando"
                  ? "selected"
                  : ""
              }>
              Funcionando
            </option>

            <option
              value="Quebrado"
              ${
                item.status ===
                "Quebrado"
                  ? "selected"
                  : ""
              }>
              Quebrado
            </option>

          </select>

        </div>

        <div class="form-group full">

          <label>
            Observação
          </label>

          <textarea
            id="edit-observacao"
          >${escapeHTML(
            item.observacao || ""
          )}</textarea>

        </div>

      </div>

      <div class="actions">

        <button
          type="submit"
          class="btn btn-primary">

          Salvar alterações

        </button>

        <button
          type="button"
          class="btn btn-secondary"
          onclick="fecharModal()">

          Cancelar

        </button>

      </div>

    </form>

  `;

  const modalContent =
    document.getElementById(
      "modalContent"
    );

  const modal =
    document.getElementById(
      "modalEditar"
    );

  if (!modalContent || !modal) {

    alert(
      "Modal de edição não encontrado no HTML."
    );

    return;
  }

  modalContent.innerHTML =
    html;

  modal.classList.add(
    "show"
  );

  const formulario =
    document.getElementById(
      "form-edicao"
    );

  formulario.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();

      const novoCodigo =
        document.getElementById(
          "edit-codigo"
        ).value.trim();

      const novoNome =
        document.getElementById(
          "edit-nome"
        ).value.trim();

      const novoStatus =
        document.getElementById(
          "edit-status"
        ).value;

      const novaObservacao =
        document.getElementById(
          "edit-observacao"
        ).value.trim();

      let novaFuncao = "";

      if (

      ) {

          ).value.trim();

        !novoCodigo ||

      ) {

        );

      } =
        await supabaseClient

          .eq(

          )

          .neq(

            item.id
          )

      if (erroDuplicado) {

      const dadosAtualizados = {

        codigo:
          novoCodigo,

            ? novaFuncao
            : null,

        status:
          novoStatus,

        observacao:
          novaObservacao || null

      };

      /*
       * Se passou de funcionando
       * para quebrado, registra
       * data e hora automaticamente.
       */

      if (
        item.status !==
          "Quebrado" &&
        novoStatus ===
          "Quebrado"
      ) {

        const agora =
          dataHoraAtual();

        dadosAtualizados.quebrado_data =
          agora.data;

        dadosAtualizados.quebrado_hora =
          agora.hora;

        dadosAtualizados.quebrado_observacao =
          novaObservacao || null;

      }

      /*
       * Se voltou de quebrado
       * para funcionando,
       * limpa os dados da quebra.
       */

      if (
        item.status ===
          "Quebrado" &&
        novoStatus ===
          "Funcionando"
      ) {

        dadosAtualizados.quebrado_data =
          null;

        dadosAtualizados.quebrado_hora =
          null;

        dadosAtualizados.quebrado_observacao =
          null;

      }

      const {
        error
      } =
        await supabaseClient

          .from("equipamentos")

          .update(
            dadosAtualizados
          )

          .eq(
            "id",
            item.id
          );

      if (error) {

        console.error(
          "Erro ao atualizar:",
          error
        );

        alert(
          "Não foi possível salvar as alterações."
        );

        return;
      }

      fecharModal();

      await carregarDados();

      renderPage(tipo);

      atualizarDashboard();

      /*
       * Se a aba de quebrados
       * estiver aberta, atualiza.
       */

      const paginaQuebrados =
        document.getElementById(
          "quebrados"
        );

      if (
        paginaQuebrados &&
        paginaQuebrados.classList.contains(
          "active"
        )
      ) {

        renderBroken();

      }

      alert(
        "Alterações salvas com sucesso!"
      );

    }
  );

}

/* =========================================================
   EXCLUIR EQUIPAMENTO
   ========================================================= */

async function excluirEquipamento(
  tipo,
  id
) {

  const item =
    dados[tipo].find(
      equipamento =>
        String(equipamento.id) ===
        String(id)
    );

  if (!item) {

    alert(
      "Equipamento não encontrado."
    );

    return;
  }

  const confirmou =
    confirm(
      `Deseja realmente excluir o equipamento "${item.nome}" (${item.codigo})?`
    );

  if (!confirmou) {
    return;
  }

  const {
    error
  } =
    await supabaseClient

      .from("equipamentos")

      .delete()

      .eq(
        "id",
        item.id
      );

  if (error) {

    console.error(
      "Erro ao excluir:",
      error
    );

    alert(
      "Não foi possível excluir o equipamento."
    );

    return;
  }

  await carregarDados();

  /*
   * Se a página atual ficar
   * vazia depois da exclusão,
   * volta uma página.
   */

  const lista =
    filtrarDados(tipo);

  const totalPaginas =
    Math.max(
      1,
      Math.ceil(
        lista.length /
        POR_PAGINA
      )
    );

  if (
    paginas[tipo] >
    totalPaginas
  ) {

    paginas[tipo] =
      totalPaginas;

  }

  renderPage(tipo);

  atualizarDashboard();

  alert(
    "Equipamento excluído com sucesso!"
  );

}


/* =========================================================
   EQUIPAMENTOS QUEBRADOS
   ========================================================= */

function obterQuebrados() {

  let resultado = [];

  tipos.forEach(
    function (tipo) {

      dados[tipo].forEach(
        function (item) {

          if (
            item.status ===
            "Quebrado"
          ) {

            resultado.push({

              ...item,

              tipo: tipo

            });

          }

        }
      );

    }
  );

  resultado.sort(
    function (a, b) {

      const dataA =
        a.quebradoEm
          ? `${a.quebradoEm.data} ${a.quebradoEm.hora}`
          : "";

      const dataB =
        b.quebradoEm
          ? `${b.quebradoEm.data} ${b.quebradoEm.hora}`
          : "";

      return dataB.localeCompare(
        dataA
      );

    }
  );

  return resultado;
}


/* =========================================================
   FILTROS DOS QUEBRADOS
   ========================================================= */

function filtrarQuebrados() {

  const buscaElemento =
    document.getElementById(
      "busca-quebrados"
    );

  const dataElemento =
    document.getElementById(
      "filtro-data"
    );

  const mesElemento =
    document.getElementById(
      "filtro-mes"
    );

  const anoElemento =
    document.getElementById(
      "filtro-ano"
    );

  const busca =
    buscaElemento
      ? buscaElemento.value
          .trim()
          .toLowerCase()
      : "";

  const data =
    dataElemento
      ? dataElemento.value
      : "";

  const mes =
    mesElemento
      ? mesElemento.value
      : "";

  const ano =
    anoElemento
      ? anoElemento.value
      : "";

  let lista =
    obterQuebrados();

  lista =
    lista.filter(
      function (item) {

        const codigo =
          (
            item.codigo ||
            ""
          )
            .toLowerCase();

        const nome =
          (
            item.nome ||
            ""
          )
            .toLowerCase();

        /*
         * Busca por código ou nome.
         */

        if (
          busca &&
          !codigo.includes(
            busca
          ) &&
          !nome.includes(
            busca
          )
        ) {

          return false;

        }

        /*
         * Filtro por data completa.
         */

        if (
          data &&
          (
            !item.quebradoEm ||
            item.quebradoEm.data !==
              data
          )
        ) {

          return false;

        }

        /*
         * Filtro por mês.
         */

        if (mes) {

          if (
            !item.quebradoEm
          ) {

            return false;

          }

          const mesQuebra =
            item.quebradoEm.data
              .split("-")[1];

          if (
            mesQuebra !==
            String(mes).padStart(
              2,
              "0"
            )
          ) {

            return false;

          }

        }

        /*
         * Filtro por ano.
         */

        if (ano) {

          if (
            !item.quebradoEm
          ) {

            return false;

          }

          const anoQuebra =
            item.quebradoEm.data
              .split("-")[0];

          if (
            anoQuebra !==
            String(ano)
          ) {

            return false;

          }

        }

        return true;

      }
    );

  return lista;
}


/* =========================================================
   RENDERIZAR EQUIPAMENTOS QUEBRADOS
   ========================================================= */

function renderBroken() {

  const container =
    document.getElementById(
      "tabela-quebrados"
    );

  if (!container) {
    return;
  }

  const lista =
    filtrarQuebrados();

  const totalPaginas =
    Math.max(
      1,
      Math.ceil(
        lista.length /
        POR_PAGINA
      )
    );

  if (
    paginas.quebrados >
    totalPaginas
  ) {

    paginas.quebrados =
      totalPaginas;

  }

  const inicio =
    (
      paginas.quebrados - 1
    ) * POR_PAGINA;

  const pagina =
    lista.slice(
      inicio,
      inicio + POR_PAGINA
    );

  if (
    pagina.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        Nenhum equipamento quebrado
        encontrado com os filtros
        selecionados.

      </div>

    `;

    return;
  }

  let html = `

    <div class="table-container">

      <table>

        <thead>

          <tr>

            <th>
              Equipamento
            </th>

            <th>
              Código
            </th>

            <th>
              Nome
            </th>

            <th>
              Data da quebra
            </th>

            <th>
              Hora
            </th>

            <th>
              Observação
            </th>

            <th>
              Ações
            </th>

          </tr>

        </thead>

        <tbody>
  `;

  pagina.forEach(
    function (item) {

      html += `

        <tr>

          <td>

            <strong>

              ${escapeHTML(
                nomesTipos[
                  item.tipo
                ] ||
                item.tipo
              )}

            </strong>

          </td>

          <td>

            ${escapeHTML(
              item.codigo
            )}

          </td>

          <td>

            ${escapeHTML(
              item.nome
            )}

          </td>

          <td>

            ${
              item.quebradoEm
                ? formatarDataExibicao(
                    item.quebradoEm.data
                  )
                : "-"
            }

          </td>

          <td>

            ${
              item.quebradoEm
                ? escapeHTML(
                    item.quebradoEm.hora
                  )
                : "-"
            }

          </td>

          <td>

            ${escapeHTML(
              item.observacao ||
              item.quebradoEm?.observacao ||
              "-"
            )}

          </td>

          <td>

            <div class="table-actions">

              <button
                class="edit-btn"
                onclick="editarQuebrado('${item.tipo}','${item.id}')">

                ✏️ Editar

              </button>

              <button
                class="delete-btn"
                onclick="excluirQuebrado('${item.tipo}','${item.id}')">

                🗑️ Excluir

              </button>

            </div>

          </td>

        </tr>

      `;

    }
  );

  html += `

        </tbody>

      </table>

    </div>

  `;

  html += criarPaginacao(
    "quebrados",
    totalPaginas,
    paginas.quebrados,
    "broken"
  );

  container.innerHTML =
    html;
}


/* =========================================================
   FORMATAR DATA PARA EXIBIÇÃO
   ========================================================= */

function formatarDataExibicao(
  data
) {

  if (!data) {
    return "-";
  }

  const partes =
    data.split("-");

  if (
    partes.length !== 3
  ) {

    return data;

  }

  return (
    `${partes[2]}/${partes[1]}/${partes[0]}`
  );
}


/* =========================================================
   PREENCHER ANOS DO FILTRO
   ========================================================= */

function preencherAnos() {

  const select =
    document.getElementById(
      "filtro-ano"
    );

  if (!select) {
    return;
  }

  const anoSelecionado =
    select.value;

  const anos =
    new Set();

  obterQuebrados().forEach(
    function (item) {

      if (
        item.quebradoEm &&
        item.quebradoEm.data
      ) {

        const ano =
          item.quebradoEm.data
            .split("-")[0];

        if (ano) {
          anos.add(ano);
        }

      }

    }
  );

  const listaAnos =
    Array.from(anos)
      .sort()
      .reverse();

  select.innerHTML = `
    <option value="">
      Todos os anos
    </option>
  `;

  listaAnos.forEach(
    function (ano) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        ano;

      option.textContent =
        ano;

      if (
        ano ===
        anoSelecionado
      ) {

        option.selected =
          true;

      }

      select.appendChild(
        option
      );

    }
  );
}


/* =========================================================
   EDITAR EQUIPAMENTO QUEBRADO
   ========================================================= */

async function editarQuebrado(
  tipo,
  id
) {

  const item =
    dados[tipo]?.find(
      equipamento =>
        String(
          equipamento.id
        ) === String(id)
    );

  if (!item) {

    alert(
      "Equipamento não encontrado."
    );

    return;
  }

  let html = `

    <form id="form-edicao-quebrado">

      <div class="form-grid">

        <div class="form-group">

          <label>
            Código
          </label>

          <input
            id="edit-quebrado-codigo"
            value="${escapeHTML(
              item.codigo
            )}"
            required>

        </div>

        <div class="form-group">

          <label>
            Nome
          </label>

          <input
            id="edit-quebrado-nome"
            value="${escapeHTML(
              item.nome
            )}"
            required>

        </div>

        <div class="form-group">

          <label>
            Data da quebra
          </label>

          <input
            type="date"
            id="edit-quebrado-data"
            value="${
              item.quebradoEm?.data ||
              ""
            }"
            required>

        </div>

        <div class="form-group">

          <label>
            Hora da quebra
          </label>

          <input
            type="time"
            step="1"
            id="edit-quebrado-hora"
            value="${
              item.quebradoEm?.hora ||
              ""
            }"
            required>

        </div>

        <div class="form-group full">

          <label>
            Observação
          </label>

          <textarea
            id="edit-quebrado-observacao"
          >${escapeHTML(
            item.observacao ||
            item.quebradoEm?.observacao ||
            ""
          )}</textarea>

        </div>

      </div>

      <div class="actions">

        <button
          type="submit"
          class="btn btn-primary">

          Salvar alterações

        </button>

        <button
          type="button"
          class="btn btn-secondary"
          onclick="fecharModalQuebrado()">

          Cancelar

        </button>

      </div>

    </form>

  `;

  /*
   * Usa o mesmo modal de edição
   * caso o HTML não tenha um modal
   * separado para quebrados.
   */

  const modal =
    document.getElementById(
      "modalEditar"
    );

  const modalContent =
    document.getElementById(
      "modalContent"
    );

  if (!modal || !modalContent) {

    alert(
      "Modal de edição não encontrado."
    );

    return;
  }

  modalContent.innerHTML =
    html;

  modal.classList.add(
    "show"
  );

  const formulario =
    document.getElementById(
      "form-edicao-quebrado"
    );

  formulario.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();

      const novoCodigo =
        document.getElementById(
          "edit-quebrado-codigo"
        ).value.trim();

      const novoNome =
        document.getElementById(
          "edit-quebrado-nome"
        ).value.trim();

      const novaData =
        document.getElementById(
          "edit-quebrado-data"
        ).value;

      const novaHora =
        document.getElementById(
          "edit-quebrado-hora"
        ).value;

      const novaObservacao =
        document.getElementById(
          "edit-quebrado-observacao"
        ).value.trim();

      if (
        !novoCodigo ||
        !novoNome ||
        !novaData ||
        !novaHora
      ) {

        alert(
          "Preencha todos os campos obrigatórios."
        );

        return;
      }

      const {
        error
      } =
        await supabaseClient

          .from("equipamentos")

          .update({

            codigo:
              novoCodigo,

            nome:
              novoNome,

            status:
              "Quebrado",

            observacao:
              novaObservacao || null,

            quebrado_data:
              novaData,

            quebrado_hora:
              novaHora,

            quebrado_observacao:
              novaObservacao || null

          })

          .eq(
            "id",
            item.id
          );

      if (error) {

        console.error(
          "Erro ao atualizar quebrado:",
          error
        );

        alert(
          "Não foi possível atualizar o equipamento."
        );

        return;
      }

      fecharModal();

      await carregarDados();

      preencherAnos();

      renderBroken();

      atualizarDashboard();

      alert(
        "Equipamento quebrado atualizado com sucesso!"
      );

    }
  );
}


/* =========================================================
   EXCLUIR EQUIPAMENTO QUEBRADO
   ========================================================= */

async function excluirQuebrado(
  tipo,
  id
) {

  const item =
    dados[tipo]?.find(
      equipamento =>
        String(
          equipamento.id
        ) === String(id)
    );

  if (!item) {

    alert(
      "Equipamento não encontrado."
    );

    return;
  }

  const confirmou =
    confirm(
      `Deseja realmente excluir o registro "${item.nome}" (${item.codigo})?`
    );

  if (!confirmou) {
    return;
  }

  const {
    error
  } =
    await supabaseClient

      .from("equipamentos")

      .delete()

      .eq(
        "id",
        item.id
      );

  if (error) {

    console.error(
      "Erro ao excluir quebrado:",
      error
    );

    alert(
      "Não foi possível excluir o registro."
    );

    return;
  }

  await carregarDados();

  preencherAnos();

  paginas.quebrados = 1;

  renderBroken();

  atualizarDashboard();

  alert(
    "Registro excluído com sucesso!"
  );
}

   ========================================================= */

async function atualizarAbaAtual() {

  await carregarDados();

  const paginaAtiva =
    document.querySelector(
      ".page.active"
    );

  if (!paginaAtiva) {
    return;
  }

  const id =
    paginaAtiva.id;

  if (
    tipos.includes(id)
  ) {

    renderPage(id);

  }

  if (
    id === "dashboard"
  ) {

    atualizarDashboard();

  }

  if (
    id === "quebrados"
  ) {

    preencherAnos();

    renderBroken();

  }

}
